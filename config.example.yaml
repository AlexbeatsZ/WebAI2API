version: 4
logLevel: info

server:
  port: 3000
  auth: sk-change-me-to-your-secure-key
  keepalive:
    mode: comment
  imageMarkdown: false

runtime:
  scheduling: least_loaded
  queueBuffer: 2
  requestTimeoutMs: 120000
  maxRetries: 2
  imageLimit: 5

browserProfiles:
  - id: default
    name: Default browser
    userDataDir: camoufoxUserData
    proxy:
      enabled: false
    sites:
      - id: gemini-web
        pages: 1

browser:
  path: ""
  headless: false
  fission: true
  humanizeCursor: true
  perProfileDisplay: true
  cssInject:
    animation: false
    filter: false
    font: false

backend:
  adapter:
    chatgpt_text:
      temporaryChat: false
      # projectUrl: https://chatgpt.com/g/g-p-example/project
      # mcpAppName: AI Decision
      # requireMcpApp: true
      # conversationRolloverMode: run_count # run_count | fixed_time | manual
      # maxRunsPerChat: 80
      # timezone: Asia/Shanghai
      # logicalDayStartsAtHour: 4
